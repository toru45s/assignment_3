<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment 3</title>
  </head>
  <body>
    <h1>Assignment 3</h1>
    <form action="{% url 'result' %}" method="post">
      {% csrf_token %}

      <div>
        <label for="x">X: </label>
        <input
          type="number"
          name="x"
          min="0"
          placeholder="Enter first number"
        />
      </div>

      <div>
        <label for="y">Y: </label>
        <input
          type="number"
          name="y"
          min="0"
          placeholder="Enter second number"
        />
      </div>

      <div>
        <label for="z">Z: </label>
        <input
          type="number"
          name="z"
          min="0"
          placeholder="Enter third number"
        />
      </div>

      <button type="submit">Calculate</button>
    </form>
  </body>
</html>
